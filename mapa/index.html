<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Metro de Lisboa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #mapa {
      height: 100%;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="mapa"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const mapa = L.map('mapa').setView([38.74, -9.15], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(mapa);

    fetch('grafo.json')
      .then(res => res.json())
      .then(desenharMapa);

    function desenharMapa(dados) {
      const estacoesPorId = {};
      dados.estacoes.forEach(e => { estacoesPorId[e.id] = e; });

      // ligações entre estações, coloridas por linha
      dados.ligacoes.forEach(lig => {
        const origem = estacoesPorId[lig.origem];
        const destino = estacoesPorId[lig.destino];

        L.polyline(
          [[origem.lat, origem.lon], [destino.lat, destino.lon]],
          { color: lig.cor, weight: 4, opacity: 0.8 }
        ).addTo(mapa);
      });

      // marcadores das estações
      dados.estacoes.forEach(estacao => {
        L.circleMarker([estacao.lat, estacao.lon], {
          radius: 5,
          color: '#333',
          weight: 2,
          fillColor: '#fff',
          fillOpacity: 1,
        })
          .bindPopup(`<b>${estacao.nome}</b><br>${estacao.linhas.join(', ')}`)
          .addTo(mapa);
      });

      // caminho mais rápido, destacado por cima
      if (dados.caminho && dados.caminho.length > 1) {
        const pontos = dados.caminho.map(id => {
          const e = estacoesPorId[id];
          return [e.lat, e.lon];
        });

        L.polyline(pontos, {
          color: '#000000',
          weight: 6,
          opacity: 0.6,
          dashArray: '8, 6',
        }).addTo(mapa);
      }
    }
  </script>
</body>
</html>
